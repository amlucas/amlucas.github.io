<article class="markdown-body blog-body">
  <h1 id="surrogate-model-of-a-tank-treading-red-blood-cell">Surrogate Model of a Tank-Treading Red Blood Cell</h1>
<figure class="image-wrap image-center" style="width: 100%;">
<div class="mesh-anim rbc-surrogate" data-src="../images/research/rbc-surrogate/surrogate.bin">
  <canvas class="mesh-anim-canvas"></canvas>
  <div class="rbc-readout"></div>
  <div class="mesh-anim-controls">
    <button type="button" class="mesh-anim-play" disabled>Pause</button>
    <input type="range" class="mesh-anim-slider" min="0" max="0" value="0"
           step="1" disabled aria-label="time in shear times" />
    <button type="button" class="rbc-reset">Reset</button>
  </div>
  <div class="rbc-conditions">
    <label class="rbc-condition">
      <span class="rbc-condition-name">Ca</span>
      <span class="rbc-slider-wrap">
        <input type="range" class="rbc-slider" data-param="ca"
               min="0" max="1000" value="500" step="1" aria-label="capillary number" />
        <span class="rbc-band"></span>
      </span>
    </label>
    <label class="rbc-condition">
      <span class="rbc-condition-name">&lambda;</span>
      <span class="rbc-slider-wrap">
        <input type="range" class="rbc-slider" data-param="lam"
               min="0" max="1000" value="500" step="1" aria-label="viscosity ratio" />
        <span class="rbc-band"></span>
      </span>
    </label>
    <p class="rbc-note">Shaded: the range of flow conditions the surrogate was
    trained on. Outside it the shape is an extrapolation.</p>
  </div>
  <div class="mesh-anim-status">Loading…</div>
</div>
<figcaption class="image-caption">Surrogate, evaluated live. Slide the capillary number Ca  and the viscosity ratio <script type="math/tex">\lambda</script> to change flow conditions.</figcaption>
</figure>
